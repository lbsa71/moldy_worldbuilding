name: Deploy validated game to R2

on:
  workflow_run:
    workflows: ['Validate game']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: fading-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Check that this build is still the current main revision
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha')"
          if [ "$latest_sha" = "$VALIDATED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: terraform/workers/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: fading-static-site
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: npm ci --no-fund
        working-directory: terraform/workers
      - name: Upload the validated artifact
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            relative_path="${file#dist/}"
            terraform/workers/node_modules/.bin/wrangler r2 object put "moldy-worldbuilding-assets/$relative_path" --file="$file"
          done < <(find dist -type f ! -name '*.html' -print0)
          # Publish entrypoints only after their referenced assets are available.
          while IFS= read -r -d '' file; do
            relative_path="${file#dist/}"
            terraform/workers/node_modules/.bin/wrangler r2 object put "moldy-worldbuilding-assets/$relative_path" --file="$file"
          done < <(find dist -type f -name '*.html' -print0)
