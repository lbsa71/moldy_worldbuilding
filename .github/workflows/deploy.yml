name: Publish Fading to GitHub Pages

on:
  workflow_run:
    workflows: ['Validate game']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: fading-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Check that this build is still the current main revision
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha')"
          if [ "$latest_sha" = "$VALIDATED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.current == 'true'
        with:
          name: fading-static-site
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check out the publishing repository
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: lbsa71/lbsa71.github.io
          ref: master
          path: pages
          persist-credentials: false
      - name: Publish only the Fading directory
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          # Use an explicit identity for pushes, independent of checkout's auth lifetime.
          key_file="$(mktemp "$RUNNER_TEMP/fading-pages-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/fading-pages-hosts.XXXXXX")"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key_file"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i \"$key_file\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$known_hosts\""
          git -C pages remote set-url origin git@github.com:lbsa71/lbsa71.github.io.git
          # Never delete or overwrite the other projects in the publishing repo.
          test -s dist/index.html
          test -s dist/journey/index.html
          test -s dist/scene-study/living-scene.glb
          mkdir -p pages/fading
          rsync -a --delete dist/ pages/fading/
          printf '{"source":"%s","validationRun":"%s"}\n' \
            "$VALIDATED_SHA" '${{ github.event.workflow_run.html_url }}' > pages/fading/release.json
          git -C pages config user.name 'Fading publishing bot'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -- fading
          if git -C pages diff --cached --quiet; then
            echo 'The validated build is already published.'
            exit 0
          fi
          git -C pages commit -m "Publish Fading from $VALIDATED_SHA"
          # Rebase on concurrent updates from other projects, never force-push.
          for attempt in 1 2 3; do
            latest_sha="$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha')"
            if [ "$latest_sha" != "$VALIDATED_SHA" ]; then
              echo 'A newer source revision exists; skipping this build.'
              exit 0
            fi
            git -C pages pull --rebase origin master
            if git -C pages push origin HEAD:master; then
              exit 0
            fi
          done
          echo 'Publishing failed after three attempts.' >&2
          exit 1
